services:

  db-deploy:
    build:
      context: .
      dockerfile: ./deploy/db-deploy/Dockerfile
    image: ${APP_CODE}-db-deploy:latest
    platform: linux/amd64
    container_name: "${APP_CODE}-db-deploy"
    environment:
      - APP_CODE=${APP_CODE}
      - ENV=${ENV}
      - DB_PORT=${DB_PORT}
      - DB_ADMIN_PWD=${DB_ADMIN_PWD}
      - DB_SUPPORT_PWD=${DB_SUPPORT_PWD}
      - DB_APP_PWD=${DB_APP_PWD}
      - TZ=GMT
    depends_on:
      - postgres
    networks:
      - "${APP_CODE}net"

  postgres:
    image: postgres:17-alpine
    container_name: "${APP_CODE}-postgres"
    ports:
      - "${DB_PUB_PORT}:${DB_PORT}"
    environment:
      - SERVICE=${APP_CODE}-postgres
      - POSTGRES_DB=db_${APP_CODE}
      - POSTGRES_USER=${DB_ADMIN_USER}
      - POSTGRES_PASSWORD=${DB_ADMIN_PWD}
      - TZ=UTC
    networks:
      - "${APP_CODE}net"

  redis:
    image: redis:8.8.0-alpine
    container_name: ${APP_CODE}-redis
    environment:
      - TZ=GMT
    ports:
      - "${REDIS_PUB_PORT}:${REDIS_PORT}"
    networks:
      - "${APP_CODE}net"

  worker:
      build:
        context: .
        dockerfile: ./deploy/worker/Dockerfile
      image: ${APP_CODE}-worker:latest
      container_name: ${APP_CODE}-worker
      command: ["/bin/sh", "/app/start.sh"]
      restart: unless-stopped   
      healthcheck:
        test: ["CMD", "python", "/app/health.py"]
        interval: 30s
        timeout: 5s
        retries: 3
        start_period: 30s
      ports:
        - "${API_PUB_PORT}:${API_PORT}"           
      environment:
        - ENV=${ENV}
        - APP_CODE=${APP_CODE}
        - RESULT_EXPIRATION_SEC=${RESULT_EXPIRATION_SEC}
        - REDIS_HOST=${APP_CODE}-redis
        - REDIS_PORT=${REDIS_PORT}
        - ACK_TYPE=${ACK_TYPE}
        - WORKER_RETRY_DELAY=${WORKER_RETRY_DELAY}
        - TASKIQ_WORKERS=${TASKIQ_WORKERS}
        - TASKIQ_MAX_ASYNC_TASKS=${TASKIQ_MAX_ASYNC_TASKS}
        - TASKIQ_MAX_PREFETCH=${TASKIQ_MAX_PREFETCH}
        - TASKIQ_MAX_THREADPOOL_THREADS=${TASKIQ_MAX_THREADPOOL_THREADS}
        - TASKIQ_MAX_PROCESS_POOL_PROCESSES=${TASKIQ_MAX_PROCESS_POOL_PROCESSES}
        - DB_HOST=${APP_CODE}-postgres
        - DB_APP_PWD=${DB_APP_PWD}
        - DB_SUPPORT_PWD=${DB_SUPPORT_PWD}
        - DB_NAME=db_${APP_CODE}
        - DB_PORT=${DB_PORT}
        - DB_MAX_POOL=${DB_MAX_POOL_WORKER}
        - API_PORT=${API_PORT}
        - API_STATIC_DIR=${API_STATIC_DIR}
        - TZ=GMT
        - LOG_LEVEL=info
        - LOG_DIR=/logs
        - LOG_TO_FILE=true
        - DATA_DIR=/data
        - BACKUP_COUNT=10
        - PYTHONPATH=/app/src
        - PYTHONDONTWRITEBYTECODE=1
        - START_UP=${START_UP}
        - JOB_PATH=${JOB_PATH}
        - JOB_VERSION=${JOB_VERSION}
        - CONNECTION_PATH=${CONNECTION_PATH}
        - CONNECTION_VERSION=${CONNECTION_VERSION}
        - GATE_CLOSE_PATH=${GATE_CLOSE_PATH}      
        - WATCHFILES_FORCE_POLLING=1      
      depends_on:
        redis:
          condition: service_started
        db-deploy:
          condition: service_completed_successfully          
      links:
        - redis
      volumes:
        - ./src/api:/app/src/api:rw
        - ./src/shared:/app/src/shared:ro
        - ./src/worker:/app/src/worker:ro
        - ./data:/data:rw
        - ./logs:/logs:rw
        - ./job${JOB_VERSION}.yml:/app/job${JOB_VERSION}.yml:r
        - ./connection${CONNECTION_VERSION}.yml:/app/connection${CONNECTION_VERSION}.yml:r
        - ./data/gate:/app/gate:ro
      networks:
        - "${APP_CODE}net"

  test:
    build:
      context: .
      dockerfile: ./deploy/test-runner/Dockerfile
    container_name: ${APP_CODE}-test-runner
    command: bash -lc "cd /app && tox -vv"
    environment:
      - SERVICE=${APP_CODE}-test
      - APP_CODE=${APP_CODE}
      - API_HOST=${APP_CODE}-worker
      - API_PORT=${API_PORT}
      - DB_PORT=${DB_PORT}
      - DB_HOST=${APP_CODE}-postgres
      - DB_SUPPORT_PWD=${DB_SUPPORT_PWD}
      - DB_APP_PWD=${DB_APP_PWD}
      - ENV=${ENV}
      - REDIS_HOST=${APP_CODE}-redis
      - REDIS_PORT=${REDIS_PORT}
      - LOG_LEVEL=info
      - LOG_DIR=/logs
      - DATA_DIR=/data
      - LOG_TO_FILE=true
      - LOG_BACKUPS=14
      - PYTHONPATH=/app/src
      - JOB_PATH=${JOB_PATH}
      - JOB_VERSION=${JOB_VERSION}
      - CONNECTION_PATH=${CONNECTION_PATH}
      - CONNECTION_VERSION=${CONNECTION_VERSION}
      - GATE_CLOSE_PATH=${GATE_CLOSE_PATH}      
    volumes:
      - ./tests:/app/tests:rw
      - ./logs:/logs:rw      
      - ./data:/data:rw
      - ./src:/app/src:rw
      - ./job${JOB_VERSION}.yml:/app/job${JOB_VERSION}.yml:r
      - ./connection${CONNECTION_VERSION}.yml:/app/connection${CONNECTION_VERSION}.yml:r
      - ./data/gate:/app/gate:rw
    networks:
      - "${APP_CODE}net"

networks:
  aworknet:
